<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Runner</title>
  <style>
    :root { color-scheme: dark; --bg: #0b1119; --line: #263446; --cyan: #63d9c7; --orange: #ff8a3d; --text: #f3eee5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
    main { width: min(94vw, 760px); }
    header { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 12px; color: #9baabc; font-size: 12px; text-transform: uppercase; letter-spacing: .13em; }
    canvas { width: 100%; height: auto; display: block; border: 1px solid var(--line); background: #111b27; }
    footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 12px; color: #9baabc; font-size: 12px; }
    kbd { padding: 2px 5px; border: 1px solid var(--line); color: var(--cyan); }
  </style>
</head>
<body>
  <main><header><span>SIGNAL RUNNER</span><span id="score">SCORE 000</span></header><canvas id="game" width="760" height="460" aria-label="Signal Runner 游戏画布"></canvas><footer><span>方向键 / WASD 移动</span><span><kbd>R</kbd> 重新开始</span></footer></main>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const keys = new Set();
    let player, target, score, started, ended, last, spawn;
    function reset() { player = { x: canvas.width / 2, y: canvas.height / 2, r: 14, speed: 4.2 }; target = { x: 150, y: 160, r: 9 }; score = 0; started = false; ended = false; last = performance.now(); spawn = 0; scoreEl.textContent = 'SCORE 000'; }
    function key(e, down) { keys[down ? 'add' : 'delete'](e.key.toLowerCase()); if (down && e.key.toLowerCase() === 'r') reset(); if (down) started = true; }
    addEventListener('keydown', e => key(e, true)); addEventListener('keyup', e => key(e, false)); reset();
    function tick(now) { const dt = Math.min(32, now - last) / 16.67; last = now; if (!ended && started) update(dt); draw(now); requestAnimationFrame(tick); }
    function update(dt) { let dx = 0, dy = 0; if (keys.has('arrowleft') || keys.has('a')) dx--; if (keys.has('arrowright') || keys.has('d')) dx++; if (keys.has('arrowup') || keys.has('w')) dy--; if (keys.has('arrowdown') || keys.has('s')) dy++; const len = Math.hypot(dx, dy) || 1; player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x + dx / len * player.speed * dt)); player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y + dy / len * player.speed * dt)); spawn += dt; if (Math.hypot(player.x - target.x, player.y - target.y) < player.r + target.r) { score++; scoreEl.textContent = 'SCORE ' + String(score).padStart(3, '0'); target = { x: 30 + Math.random() * (canvas.width - 60), y: 30 + Math.random() * (canvas.height - 60), r: Math.max(5, 10 - score * .05) }; spawn = 0; } if (spawn > 520) ended = true; }
    function draw(now) { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = 'rgba(99,217,199,.08)'; ctx.lineWidth = 1; for (let x=20;x<canvas.width;x+=38){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()} for(let y=20;y<canvas.height;y+=38){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()} const pulse = 1 + Math.sin(now / 180) * .16; ctx.fillStyle = '#ff8a3d'; ctx.beginPath(); ctx.arc(target.x, target.y, target.r * pulse, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#ff8a3d'; ctx.globalAlpha = .35; ctx.beginPath(); ctx.arc(target.x, target.y, target.r * 2.5 * pulse, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1; ctx.fillStyle = '#63d9c7'; ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill(); if (!started || ended) { ctx.fillStyle = 'rgba(11,17,25,.78)'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.textAlign = 'center'; ctx.fillStyle = '#f3eee5'; ctx.font = '32px Georgia, serif'; ctx.fillText(ended ? '时间到' : '接住光点', canvas.width/2, canvas.height/2 - 8); ctx.fillStyle = '#9baabc'; ctx.font = '14px system-ui, sans-serif'; ctx.fillText(ended ? '按 R 再来一局' : '按任意方向键开始', canvas.width/2, canvas.height/2 + 24); } }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
