services:
  myblog:
    build: .
    container_name: myblog
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      APP_ENV: production
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      PORT: 8000
      DATA_DIR: /data
    volumes:
      - myblog_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - myblog_net

  caddy:
    image: caddy:2-alpine
    container_name: myblog_caddy
    depends_on:
      myblog:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - myblog_net

volumes:
  myblog_data:
  caddy_data:
  caddy_config:

networks:
  myblog_net:


